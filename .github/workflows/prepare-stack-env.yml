name: Prepare stack environment

on:
  push:
    branches:
      - main
    paths-ignore:
      - stack.env

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create stack.env from the example
        run: cp stack.env.example stack.env

      - name: Commit generated stack.env
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f stack.env
          if git diff --cached --quiet; then
            echo "stack.env is already up to date"
          else
            git commit -m "Update generated stack.env"
            git push
          fi

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
