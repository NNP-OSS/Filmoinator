<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filmoinator - Panel Admina</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-box {
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 40px;
            width: 360px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .login-box h1 {
            text-align: center;
            font-size: 1.6em;
            margin-bottom: 5px;
            background: linear-gradient(90deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .login-box p { text-align: center; color: #888; margin-bottom: 25px; font-size: 0.9em; }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.08);
            color: #fff;
            font-size: 1em;
            outline: none;
            margin-bottom: 12px;
        }
        input:focus { border-color: #ffd200; }
        .btn {
            width: 100%;
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            font-size: 1em;
            cursor: pointer;
            background: #ffd200;
            color: #1a1a2e;
            font-weight: 600;
        }
        .btn:hover { background: #ffe44d; }
        .flash { padding: 12px; border-radius: 8px; margin-bottom: 15px; font-size: 0.9em; text-align: center; }
        .flash.error { background: rgba(244,67,54,0.2); border: 1px solid #f44336; color: #e57373; }
        .back-link { display: block; text-align: center; margin-top: 15px; color: #666; text-decoration: none; font-size: 0.85em; }
        .back-link:hover { color: #ffd200; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>🔧 Filmoinator</h1>
        <p>Panel administracyjny</p>
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}
        <form method="POST">
            <input type="text" name="username" placeholder="Nazwa użytkownika" required>
            <input type="password" name="password" placeholder="Hasło" required>
            <button type="submit" class="btn">Zaloguj się</button>
        </form>
        <a href="{{ url_for('index') }}" class="back-link">← Powrót do strony głównej</a>
    </div>
</body>
</html>
