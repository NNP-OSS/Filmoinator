services:
  db:
    image: postgres:16-alpine
    env_file:
      - stack.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: ./app
    env_file:
      - stack.env
    depends_on:
      db:
        condition: service_healthy

  nginx:
    build: ./nginx
    ports:
      - "80"
    depends_on:
      - app

volumes:
  postgres_data:
