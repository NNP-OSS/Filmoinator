services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: filmoinator
      POSTGRES_USER: filmoinator
      POSTGRES_PASSWORD: filmoinator_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filmoinator"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: ./app
    environment:
      DATABASE_URL: postgresql://filmoinator:filmoinator_secret@db:5432/filmoinator
      SECRET_KEY: zmien_to_na_wlasny_klucz
      ADMIN_USER: admin
      ADMIN_PASS: admin123
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

volumes:
  postgres_data:
